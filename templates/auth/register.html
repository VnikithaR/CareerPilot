{% extends "base.html" %}

{% block title %}Register - CareerPilot{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            <h1>CareerPilot</h1>
        </div>

        <p class="auth-subtitle">
            Create your student account
        </p>


        <form method="POST">

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    class="form-control"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary btn-block"
            >
                Create Account
            </button>

        </form>


        <div class="auth-footer">

            <p>
                Already have an account?
                <a href="{{ url_for('auth.login') }}">
                    Login
                </a>
            </p>

        </div>

    </div>

</div>

{% endblock %}

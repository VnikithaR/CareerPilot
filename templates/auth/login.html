{% extends "base.html" %}

{% block title %}Login - CareerPilot{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            <h1>CareerPilot</h1>
        </div>

        <p class="auth-subtitle">
            Sign in to continue your career journey
        </p>

        <form method="POST">

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary btn-block"
            >
                Login
            </button>

        </form>


        <div class="auth-footer">

            <p>
                Don't have an account?
                <a href="{{ url_for('auth.register') }}">
                    Create an account
                </a>
            </p>

        </div>

    </div>

</div>

{% endblock %}
